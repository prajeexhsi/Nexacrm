{% extends 'base.html' %}{% block title %}Settings | NexaCRM{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">WORKSPACE</span><h1>Customize Your Workspace</h1><p>Add or remove modules based on your business needs.</p></div></div><div class="grid-2"><div class="card"><h3>Business Profile</h3><form method="post">{% csrf_token %}<label>Business Type<select class="input" name="business_type">{% for x in business_types %}<option {% if ws.business_type == x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Business Description<textarea class="input" name="business_description" rows="5">{{ ws.business_description }}</textarea></label><label>Plan<select class="input" name="plan"><option {% if ws.plan == "Starter" %}selected{% endif %}>Starter</option><option {% if ws.plan == "Growth" %}selected{% endif %}>Growth</option><option {% if ws.plan == "Business" %}selected{% endif %}>Business</option></select></label><button class="btn primary">Save Settings</button></div><div class="card"><h3>Your Modules</h3>{% for x in modules %}<label class="check"><input type="checkbox" name="modules" value="{{ x }}" {% if x in ws.modules %}checked{% endif %}> {{ x }}</label>{% endfor %}</form></div></div>{% endblock %}
