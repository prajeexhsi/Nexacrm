{% extends "base.html" %}{% block title %}Add Follow-up | NexaCRM{% endblock %}
{% block content %}<div class="page-head"><div><h1>Add Follow-up</h1><p>Schedule a reminder for a lead.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid">{% for field in form %}<label>{{ field.label }} {{ field }}{% if field.errors %}<em>{{ field.errors|striptags }}</em>{% endif %}</label>{% endfor %}</div><div class="form-actions"><a class="btn secondary" href="{% url 'followups' %}">Cancel</a><button class="btn primary">Save Follow-up</button></div></form></div>{% endblock %}
