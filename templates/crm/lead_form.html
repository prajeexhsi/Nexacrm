{% extends "base.html" %}{% block title %}{{ title }} | NexaCRM{% endblock %}
{% block content %}<div class="page-head"><div><h1>{{ title }}</h1><p>Enter customer details and save the lead.</p></div></div>
<div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid">{% for field in form %}<label>{{ field.label }} {{ field }}{% if field.errors %}<em>{{ field.errors|striptags }}</em>{% endif %}</label>{% endfor %}</div><div class="form-actions"><a class="btn secondary" href="{% url 'leads' %}">Cancel</a><button class="btn primary">Save Customer</button></div></form></div>{% endblock %}
