{% extends "base.html" %}{% block title %}WhatsApp Message | NexaCRM{% endblock %}
{% block content %}<div class="page-head"><div><h1>WhatsApp Message</h1><p>Prepare a message and open it directly in WhatsApp.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid">{% for field in form %}<label>{{ field.label }} {{ field }}{% if field.errors %}<em>{{ field.errors|striptags }}</em>{% endif %}</label>{% endfor %}</div><div class="form-actions"><a class="btn secondary" href="{% url 'messages' %}">Cancel</a><button class="btn primary">Log Message</button></div></form></div>{% endblock %}
