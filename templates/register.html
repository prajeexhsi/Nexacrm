{% load static %}<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | NexaCRM</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="auth"><div class="auth-card register-card"><div class="brand dark-brand"><div class="logo">✦</div><div><b>Nexa<span>CRM</span></b><small>Connect • Manage • Grow</small></div></div><span class="eyebrow">GET STARTED</span><h2>Create your account</h2><p>Build your CRM workspace in minutes.</p>{% for message in messages %}<div class="error">{{ message }}</div>{% endfor %}<form method="post">{% csrf_token %}<div class="two"><label>Full Name<input name="full_name" required></label><label>Username<input name="username" required></label></div><label>Email<input type="email" name="email" required></label><div class="two"><label>Password<input type="password" name="password" required></label><label>Confirm Password<input type="password" name="confirm_password" required></label></div><button class="btn primary full">Create Account</button></form><p class="auth-foot">Already have an account? <a href="{% url 'login' %}">Login</a></p></div></body></html>
